<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2efe8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0f0e" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="A browser-based LPC1768 and ARM7 bench for the ECE 3143 Microcontrollers & Embedded Systems lab: every manual program and exercise, a C compiler, an ARM assembler, and a simulated trainer board." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Bench — LPC1768 lab</title>
    <script>
      try {
        var t = localStorage.getItem('bench:theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

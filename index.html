    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0f0e" />
    <meta name="description" content="A browser-based LPC1768 and ARM7 bench for the ECE 3143 Microcontrollers & Embedded Systems lab: every manual example and exercise, a C compiler, an ARM assembler, and a simulated trainer board." />

      try {
        var t = localStorage.getItem('bench:theme');
        document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : 'dark';
      } catch (e) { document.documentElement.dataset.theme = 'dark'; }
    </script>
